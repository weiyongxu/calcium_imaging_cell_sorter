[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcium-imaging-cell-sorter"
version = "0.1.0"
description = "Desktop GUI for reviewing calcium-imaging cellsets and exporting cell status decisions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Calcium Imaging Cell Sorter Contributors" }
]
license = "MIT"
dependencies = [
  "contourpy>=1.2",
  "isx>=2.1,<3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PySide6>=6.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
calcium-cell-sorter = "calcium_imaging_cell_sorter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
